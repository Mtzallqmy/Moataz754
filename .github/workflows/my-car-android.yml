name: My Car Android

on:
  push:
    branches: [main, 'feat/my-car-next-generation-native']
    tags: ['my-car-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
  GODOT_VERSION: 4.7.2
  GODOT_TAG: 4.7.2-stable
  GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011

concurrency:
  group: my-car-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android build tools
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --location --retry 3 --silent --show-error \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$archive"
          printf '%s  %s\n' "$ANDROID_TOOLS_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$sdk/cmdline-tools"
          unzip -q "$archive" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          (set +o pipefail; yes | "$manager" --sdk_root="$sdk" --licenses)
          "$manager" --sdk_root="$sdk" 'build-tools;36.1.0' 'platforms;android-36'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Install verified Godot and matching templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/$GODOT_TAG"
          engine="Godot_v${GODOT_TAG}_linux.x86_64.zip"
          templates="Godot_v${GODOT_TAG}_export_templates.tpz"
          curl --fail --location --retry 3 --silent --show-error "$base/$engine" --output "$RUNNER_TEMP/$engine"
          curl --fail --location --retry 3 --silent --show-error "$base/$templates" --output "$RUNNER_TEMP/$templates"
          printf '%s  %s\n' "$GODOT_LINUX_SHA256" "$RUNNER_TEMP/$engine" "$GODOT_TEMPLATES_SHA256" "$RUNNER_TEMP/$templates" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable" "$HOME/.config/godot"
          unzip -jo "$RUNNER_TEMP/$engine" "Godot_v${GODOT_TAG}_linux.x86_64" -d "$RUNNER_TEMP/bin"
          mv "$RUNNER_TEMP/bin/Godot_v${GODOT_TAG}_linux.x86_64" "$RUNNER_TEMP/bin/godot"
          chmod +x "$RUNNER_TEMP/bin/godot"
          unzip -jo "$RUNNER_TEMP/$templates" templates/android_debug.apk templates/android_release.apk templates/version.txt -d "$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
          printf '%s\n' "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          SETTINGS
      - name: Import and run Godot integration tests
        run: |
          set -o pipefail
          mkdir -p build/android
          scripts/validate-my-car.sh | tee build/android/MyCar-test-results.txt
      - name: Export and verify development APK
        run: scripts/build-my-car-android.sh debug build/android/MyCar-ARM64-debug.apk
      - name: Upload ARM64 development artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCar-ARM64-debug
          path: |
            build/android/MyCar-ARM64-debug.apk
            build/android/MyCar-ARM64-debug.apk.sha256
            build/android/MyCar-test-results.txt
          if-no-files-found: error
      - name: Export production APK for an approved tag
        if: startsWith(github.ref, 'refs/tags/my-car-v')
        env:
          MYCAR_KEYSTORE_B64: ${{ secrets.MYCAR_KEYSTORE_B64 }}
          MYCAR_KEY_ALIAS: ${{ secrets.MYCAR_KEY_ALIAS }}
          MYCAR_STORE_PASS: ${{ secrets.MYCAR_STORE_PASS }}
          MYCAR_KEY_PASS: ${{ secrets.MYCAR_KEY_PASS }}
          MYCAR_EXPECTED_CERT_SHA256: ${{ vars.MYCAR_EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${MYCAR_KEYSTORE_B64:?Missing original signing keystore}"
          export MYCAR_KEYSTORE="$RUNNER_TEMP/my-car-release.keystore"
          umask 077
          trap 'rm -f "$MYCAR_KEYSTORE"' EXIT
          printf '%s' "$MYCAR_KEYSTORE_B64" | base64 --decode > "$MYCAR_KEYSTORE"
          scripts/build-my-car-android.sh release build/android/MyCar-ARM64.apk
      - name: Upload verified release candidate
        if: startsWith(github.ref, 'refs/tags/my-car-v')
        uses: actions/upload-artifact@v4
        with:
          name: MyCar-ARM64-release
          path: |
            build/android/MyCar-ARM64.apk
            build/android/MyCar-ARM64.apk.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/my-car-v')
    needs: validate-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MyCar-ARM64-release
          path: build/android
      - name: Verify and publish the tagged APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd build/android && sha256sum -c MyCar-ARM64.apk.sha256)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "سيارتي — My Car $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md \
            build/android/MyCar-ARM64.apk build/android/MyCar-ARM64.apk.sha256
