name: Import verified Gameme archive
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-verified-source:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Bootstrap verified Gameme archive import'
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4

      - name: Fetch pinned source and validate uploaded archive tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mohmedali23182-jpg/Car-game.git .import-src
          git -C .import-src checkout --quiet --detach baccfdcf3e43527cfb7450f01917cfa9e781c4b1
          actual_tree="$(git -C .import-src rev-parse 'HEAD^{tree}')"
          expected_tree="0cfd5b6e7ecffd1c2117aa2027dcc9c04f1aeb27"
          echo "Source tree: $actual_tree"
          echo "Uploaded ZIP tree: $expected_tree"
          test "$actual_tree" = "$expected_tree"

      - name: Import all uploaded project files to the root
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' .import-src/ ./
          rm -rf .import-src
          rm -f .github/workflows/import-gameme-archive.yml
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Import Gameme archive: React/Three.js and Godot game source"
          git push origin HEAD:main
